<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>周亦乐 · 个人主页</title>
<style>
  :root {
    --bg: #0e1014;
    --card: #171a20;
    --card-2: #1c2129;
    --bg-soft: #111419;
    --ink: #e6e9ef;
    --ink-2: #a2a9b6;
    --ink-3: #697180;
    --line: #242a33;
    --accent: #3d7bff;
    --accent-soft: rgba(61, 123, 255, .14);
    --radius: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2c323d; border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 20px 72px;
  }

  /* 顶部 */
  .hero {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .hero-text h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: .5px;
  }

  .hero-text .tagline {
    margin-top: 6px;
    color: var(--ink-2);
    font-size: 15px;
  }

  /* 分区标题 */
  .section {
    margin-top: 28px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--ink-3);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* 个人信息 */
  .info-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 8px 4px;
  }

  .info-row {
    display: flex;
    padding: 14px 22px;
    gap: 16px;
    border-bottom: 1px solid var(--line);
  }
  .info-row:last-child { border-bottom: none; }

  .info-label {
    flex: 0 0 108px;
    color: var(--ink-3);
    font-size: 14px;
  }

  .info-value {
    color: var(--ink);
    font-size: 14px;
  }
  .info-value a {
    color: var(--accent);
    text-decoration: none;
  }
  .info-value a:hover { text-decoration: underline; }

  .tag {
    display: inline-block;
    margin: 3px 6px 3px 0;
    padding: 3px 10px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    font-size: 13px;
  }

  /* 聊天区 */
  .chat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 3px rgba(34,197,94,.16);
  }

  .chat-header .name { font-size: 15px; font-weight: 600; }
  .chat-header .desc { font-size: 13px; color: var(--ink-3); }
  .chat-header .spacer { flex: 1; }

  .btn-ghost {
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--ink-2);
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s ease;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* 设置面板 */
  .settings {
    display: none;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-soft);
  }
  .settings.open { display: block; }

  .settings .field { margin-bottom: 14px; }
  .settings .field:last-child { margin-bottom: 0; }
  .settings label {
    display: block;
    font-size: 13px;
    color: var(--ink-2);
    margin-bottom: 6px;
  }
  .settings input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    background: var(--card-2);
    color: var(--ink);
    transition: border-color .15s ease;
  }
  .settings input::placeholder { color: var(--ink-3); }
  .settings input:focus { border-color: var(--accent); }

  .settings .row { display: flex; gap: 10px; align-items: center; }
  .settings .row input { flex: 1; }

  .settings .note { font-size: 12px; color: var(--ink-3); margin-top: 10px; line-height: 1.5; }

  .btn-primary {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .15s ease;
  }
  .btn-primary:hover { opacity: .88; }

  .chat-messages {
    height: 360px;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--bg-soft);
  }

  .msg {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.bot {
    background: var(--card-2);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    align-self: flex-start;
  }

  .msg.user {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
    align-self: flex-end;
  }

  .msg.error { color: #f2a4ab; background: #2a1b1e; border-color: #5c2a30; }
  .msg.typing { color: var(--ink-3); }

  /* 快捷提问 */
  .quick {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 20px 0;
  }

  .chip {
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--ink-2);
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* 输入区 */
  .chat-input {
    display: flex;
    gap: 10px;
    padding: 16px 20px 20px;
    border-top: 1px solid var(--line);
  }

  .chat-input input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14.5px;
    outline: none;
    font-family: inherit;
    background: var(--card-2);
    color: var(--ink);
    transition: border-color .15s ease;
  }
  .chat-input input::placeholder { color: var(--ink-3); }
  .chat-input input:focus { border-color: var(--accent); }

  .chat-input button {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 12px;
    padding: 0 22px;
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .15s ease;
  }
  .chat-input button:hover { opacity: .88; }
  .chat-input button:disabled { opacity: .5; cursor: default; }

  .footnote {
    margin-top: 24px;
    text-align: center;
    color: var(--ink-3);
    font-size: 12.5px;
  }

  /* 反馈入口与弹窗 */
  .feedback-fab {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 50;
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--ink-2);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: all .15s ease;
    font-family: inherit;
  }
  .feedback-fab:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .feedback-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, .62);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .feedback-overlay[hidden] { display: none; }

  .feedback-modal {
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 22px 20px;
  }

  .feedback-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .feedback-head h2 { font-size: 18px; font-weight: 700; }
  .feedback-close {
    background: none; border: none; color: var(--ink-3);
    font-size: 26px; line-height: 1; cursor: pointer; padding: 0 2px;
  }
  .feedback-close:hover { color: var(--ink); }

  .feedback-privacy { font-size: 12.5px; color: var(--ink-3); margin-bottom: 16px; line-height: 1.5; }

  .feedback-field { display: block; margin-bottom: 14px; }
  .feedback-field span { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  .feedback-field em { color: var(--ink-3); font-style: normal; font-size: 12px; }
  .feedback-field input,
  .feedback-field textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    background: var(--card-2);
    color: var(--ink);
    transition: border-color .15s ease;
    resize: vertical;
  }
  .feedback-field input::placeholder,
  .feedback-field textarea::placeholder { color: var(--ink-3); }
  .feedback-field input:focus,
  .feedback-field textarea:focus { border-color: var(--accent); }

  .feedback-error { font-size: 12.5px; color: #f2a4ab; margin-bottom: 10px; }

  .feedback-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }

  @media (max-width: 560px) {
    .hero { flex-direction: column; text-align: center; gap: 14px; }
    .info-row { flex-direction: column; gap: 4px; padding: 13px 18px; }
    .info-label { flex: none; }
    .msg { max-width: 88%; }
    .chat-messages { height: 320px; }
  }
</style>
</head>

  }

  function callLLM(userText, onDelta, onDone) {
    // 调用后端 /api/chat 代理；前端不携带任何 Key，Key 只保存在后端 .env
    return fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: buildMsgs(userText) })
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          var msg = t;
          try { var j = JSON.parse(t); if (j && j.error) msg = j.error; } catch (e) {}
          throw new Error(msg || ('接口返回 ' + res.status));
        });
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder('utf-8');

      function pump() {
        return reader.read().then(function (r) {
          if (r.done) { onDone(); return; }
          var chunk = decoder.decode(r.value, { stream: true });
          if (chunk) onDelta(chunk);
          return pump();
        });
      }
      return pump();
    });
  }

  // 在线版直连 DeepSeek（SSE 流式）；本地版仍用 callLLM 走 /api/chat
  function callLLMDirect(userText, onDelta, onDone) {
    return fetch(DEEPSEEK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + DEEPSEEK_KEY
      },
      body: JSON.stringify({
        model: DEEPSEEK_MODEL,
        messages: [{ role: 'system', content: SYSTEM_PROMPT }].concat(buildMsgs(userText).slice(-8)),
        temperature: 0.8,
        max_tokens: 800,
        stream: true
      })
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          var msg = t;
          try { var j = JSON.parse(t); if (j && j.error) msg = j.error.message || j.error; } catch (e) {}
          throw new Error(msg || ('接口返回 ' + res.status));
        });
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buffer = '';

      function pump() {
        return reader.read().then(function (r) {
          if (r.done) { onDone(); return; }
          buffer += decoder.decode(r.value, { stream: true });
          var lines = buffer.split('\n');
          buffer = lines.pop();
          for (var i = 0; i < lines.length; i++) {
            var s = lines[i].trim();
            if (s.indexOf('data:') !== 0) continue;
            var data = s.slice(5).trim();
            if (data === '[DONE]') continue;
            try {
              var obj = JSON.parse(data);
              var ch = obj.choices && obj.choices[0];
              var piece = ch && ch.delta && ch.delta.content;
              if (piece) onDelta(piece);
            } catch (e) {}
          }
          return pump();
        });
      }
      return pump();
    });
  }

  function send(text) {
    text = (text || '').trim();
    if (!text || typing) return;

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });
    inputEl.value = '';

    sendEl.disabled = true;
    typing = true;

    // 流式：先放一个空气泡，再逐字填充
    var msgEl = addMessage('', 'bot');
    var acc = '';
    var finished = false;

    function finish(replyText) {
      if (finished) return;
      finished = true;
      msgEl.textContent = replyText;
      msgEl.classList.remove('typing');
      history.push({ role: 'assistant', content: replyText });
      sendEl.disabled = false;
      typing = false;
    }

    var timer = setTimeout(function () {
      if (!acc) msgEl.textContent = '正在输入…';
      msgEl.classList.add('typing');
    }, 400);

    // 在线静态版直连 DeepSeek；本地版走 /api/chat 后端
    var caller = IS_STATIC ? callLLMDirect : callLLM;

    caller(text,
      function (delta) {
        acc += delta;
        msgEl.textContent = acc;
        msgEl.classList.remove('typing');
        clearTimeout(timer);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      },
      function () {
        clearTimeout(timer);
        finish(acc ? acc.trim() : localReply(text) + '\n\n（接口未返回内容）');
      }
    ).catch(function (e) {
      clearTimeout(timer);
      // 大模型失败时回退到本地规则
      finish(localReply(text) + '\n\n（大模型调用失败：' + e.message + '）');
    });
  }

  sendEl.addEventListener('click', function () { send(inputEl.value); });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') send(inputEl.value);
  });

  quickEl.addEventListener('click', function (e) {
    if (e.target.classList.contains('chip')) send(e.target.textContent);
  });

  // ===== 反馈 =====
  var VERSION = 'v3.8';  // 当前页面版本；归档新版本时同步更新
  var fab = document.getElementById('feedbackFab');
  var overlay = document.getElementById('feedbackOverlay');
  var closeBtn = document.getElementById('feedbackClose');
  var cancelBtn = document.getElementById('feedbackCancel');
  var form = document.getElementById('feedbackForm');
  var nameEl = document.getElementById('fbName');
  var relationEl = document.getElementById('fbRelation');
  var deviceEl = document.getElementById('fbDevice');
  var contentEl = document.getElementById('fbContent');
  var errorEl = document.getElementById('feedbackError');
  var submitBtn = document.getElementById('feedbackSubmit');

  function openFeedback() {
    overlay.hidden = false;
    errorEl.hidden = true;
    nameEl.focus();
  }
  function closeFeedback() {
    overlay.hidden = true;
    errorEl.hidden = true;
  }
  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.hidden = false;
  }

  fab.addEventListener('click', openFeedback);
  closeBtn.addEventListener('click', closeFeedback);
  cancelBtn.addEventListener('click', closeFeedback);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeFeedback(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlay.hidden) closeFeedback();
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var content = contentEl.value.trim();
    if (!content) { showError('请填写反馈内容'); contentEl.focus(); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = '提交中…';

    fetch(SUPABASE_URL + '/rest/v1/feedback', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        name: nameEl.value.trim(),
        relation: relationEl.value.trim(),
        device: deviceEl.value.trim(),
        content: content,
        version: VERSION
      })
    }).then(function (res) {
      if (res.ok) return { ok: true };
      return res.text().then(function (t) {
        var msg = '提交失败';
        try { var j = JSON.parse(t); if (j && j.message) msg = j.message; } catch (e) {}
        return { ok: false, error: msg };
      });
    }).then(function (r) {
      if (!r.ok) throw new Error(r.error || '提交失败');
      form.reset();
      closeFeedback();
      fab.textContent = '已收到 ✓';
      setTimeout(function () { fab.textContent = '反馈'; }, 2500);
    }).catch(function (err) {
      showError(err.message || '提交失败，请稍后再试');
    }).finally(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = '提交反馈';
    });
  });

  // ===== 在线静态版提示 =====
  if (IS_STATIC) {
    var note = document.createElement('div');
    note.className = 'msg bot';
    note.textContent = '提示：当前为在线版，已支持 AI 对话，直接在下方输入问题即可。';
    var firstMsg = messagesEl.firstChild;
    if (firstMsg) {
      messagesEl.insertBefore(note, firstMsg);
    } else {
      messagesEl.appendChild(note);
    }
    var ft = document.querySelector('.footnote');
    if (ft) ft.textContent = '在线版 · AI 对话已启用';
  }

  // ===== 初始化 =====
})();
</script>
</body>
</html>
